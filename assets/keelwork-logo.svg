<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Keelwork">
  <title>Keelwork</title>
  <rect width="128" height="128" rx="26" fill="#0B2545"/>
  <!-- keel: the bold vertical stroke, and the stem of the K -->
  <rect x="36" y="20" width="16" height="88" rx="3" fill="#C9A227"/>
  <!-- upper arm of the K: the hull side rising from the keel -->
  <path d="M52 68 L94 24" fill="none" stroke="#F4F1EA" stroke-width="15" stroke-linecap="butt"/>
  <!-- lower arm of the K: the bilge curve sweeping out from the keel -->
  <path d="M52 68 C72 70 88 82 96 106" fill="none" stroke="#8DA9C4" stroke-width="15" stroke-linecap="butt"/>
</svg>
